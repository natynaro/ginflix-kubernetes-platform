apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: streamer-hpa
  namespace: ginflix
  labels:
    app: streamer
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: streamer
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
