apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: database
  namespace: ginflix
  labels:
    app: database
spec:
  serviceName: database
  replicas: 3
  podManagementPolicy: OrderedReady
  selector:
    matchLabels:
      app: database
  template:
    metadata:
      labels:
        app: database
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: database
              topologyKey: kubernetes.io/hostname
      containers:
      - name: mongodb
        image: mongo:6
        imagePullPolicy: Always
        args:
        - --replSet=rs0
        - --bind_ip_all
        ports:
        - containerPort: 27017
          name: mongo
        env:
        - name: MONGO_INITDB_DATABASE
          value: ginflix
        volumeMounts:
        - name: mongo-data
          mountPath: /data/db
        readinessProbe:
          exec:
            command:
            - mongosh
            - --quiet
            - --eval
            - "db.adminCommand('ping').ok"
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 5
        livenessProbe:
          exec:
            command:
            - mongosh
            - --quiet
            - --eval
            - "db.runCommand({ serverStatus: 1 }).ok"
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 5
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
            ephemeral-storage: 128Mi
          limits:
            cpu: "1"
            memory: 1Gi
            ephemeral-storage: 1Gi
  volumeClaimTemplates:
  - metadata:
      name: mongo-data
    spec:
      accessModes:
      - ReadWriteOnce
      storageClassName: standard
      resources:
        requests:
          storage: 1Gi
