# Argo CD Application — syncs plain YAML under k8s/app/ (no secrets).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ginflix
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    # Replace this placeholder with the public or private GitHub repository URL.
    repoURL: https://github.com/your-org/ginflix.git
    targetRevision: bingrui
    path: k8s/app
  destination:
    server: https://kubernetes.default.svc
    namespace: ginflix
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
