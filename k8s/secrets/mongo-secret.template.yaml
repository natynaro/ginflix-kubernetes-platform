apiVersion: v1
kind: Secret
metadata:
  name: mongo-secret
  namespace: ginflix
type: Opaque
stringData:
  # 3-member replica set (StatefulSet database-0/1/2 + headless Service "database")
  MONGO_URI: "mongodb://database-0.database.ginflix.svc.cluster.local:27017,database-1.database.ginflix.svc.cluster.local:27017,database-2.database.ginflix.svc.cluster.local:27017/ginflix?replicaSet=rs0"