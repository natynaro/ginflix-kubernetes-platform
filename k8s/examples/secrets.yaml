# GINFlix Secrets — TEMPLATE ONLY (placeholders, safe to commit).
# Before applying: replace every <REPLACE_*> with values from your secure deployment configuration.
# Copy the required Secret documents to environment-specific files under k8s/secrets/.
# Never apply this template before replacing all placeholders.
---
apiVersion: v1
kind: Secret
metadata:
  name: s3-secret
  namespace: ginflix
type: Opaque
stringData:
  GARAGE_BUCKET: "<REPLACE_BUCKET>"
  GARAGE_ACCESS_KEY: "<REPLACE_ACCESS_KEY>"
  GARAGE_SECRET_KEY: "<REPLACE_SECRET_KEY>"
  GARAGE_ENDPOINT: "s3.example.invalid"
  GARAGE_REGION: "us-east-1"
---
apiVersion: v1
kind: Secret
metadata:
  name: mongo-secret
  namespace: ginflix
type: Opaque
stringData:
  MONGO_URI: "mongodb://database-0.database.ginflix.svc.cluster.local:27017,database-1.database.ginflix.svc.cluster.local:27017,database-2.database.ginflix.svc.cluster.local:27017/ginflix?replicaSet=rs0"
---
apiVersion: v1
kind: Secret
metadata:
  name: regcred
  namespace: ginflix
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {
      "auths": {
        "registry.example.invalid": {
          "username": "<REPLACE_REGISTRY_USER>",
          "password": "<REPLACE_REGISTRY_PASSWORD>",
          "email": "<REPLACE_EMAIL>",
          "auth": "<REPLACE_BASE64_USER_COLON_PASSWORD>"
        }
      }
    }
