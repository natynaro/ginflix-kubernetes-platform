apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-admin
  namespace: ginflix
  labels:
    app: frontend-admin
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend-admin
  template:
    metadata:
      labels:
        app: frontend-admin
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: frontend-admin
              topologyKey: kubernetes.io/hostname
      imagePullSecrets:
      - name: regcred
      containers:
      - name: frontend-admin
        image: registry.example.invalid/ginflix/frontend-admin:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        envFrom:
        - configMapRef:
            name: ginflix-config
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          tcpSocket:
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 15
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
            ephemeral-storage: 32Mi
          limits:
            cpu: 200m
            memory: 256Mi
            ephemeral-storage: 256Mi