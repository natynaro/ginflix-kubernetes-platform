# One-shot rs-init Job: allow reach database-0 only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: database-rs-init-policy
  namespace: ginflix
spec:
  podSelector:
    matchLabels:
      job: database-rs-init
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: database
    ports:
    - protocol: TCP
      port: 27017
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
