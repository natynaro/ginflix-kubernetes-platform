name: Bug report
description: Report a reproducible problem with the manifests, deployment, or documentation.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Before submitting, remove credentials, tokens, private keys, and other sensitive data from logs.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the relevant commands and sanitized output.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include OS, Kubernetes/Kind version, and relevant tool versions.
    validations:
      required: true
