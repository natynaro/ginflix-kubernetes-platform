# Admin site: https://admin.ginflix.example.invalid
# VM Nginx: Moodle TLS + Keycloak proxy; app routes → Ingress Controller
# Uses upstream ginflix_ingress defined in ginflix.conf

server {
    listen 80;
    server_name admin.ginflix.example.invalid;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name admin.ginflix.example.invalid;

    ssl_certificate     /etc/certs/ginflix.example.invalid.crt;
    ssl_certificate_key /etc/certs/ginflix.example.invalid.key;

    client_max_body_size 2G;

    # Keycloak proxy needs runtime DNS resolution (variable proxy_pass).
    resolver 127.0.0.53 valid=30s ipv6=off;
    set $keycloak_upstream identity.example.invalid;

    location ^~ /api {
        proxy_pass http://ginflix_ingress;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
    }

    location = /stream {
        proxy_pass http://ginflix_ingress;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    location ^~ /stream/ {
        proxy_pass http://ginflix_ingress;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    location = /hls.min.js {
        root /var/www/html;
        default_type application/javascript;
    }

    location = /config.js {
        root /var/www/html;
        default_type application/javascript;
        add_header Cache-Control "no-store" always;
    }

    location /realms/ {
        proxy_pass https://$keycloak_upstream;
        proxy_ssl_server_name on;
        proxy_set_header Host identity.example.invalid;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "";
        proxy_cookie_domain identity.example.invalid admin.ginflix.example.invalid;
        proxy_redirect https://identity.example.invalid/ https://admin.ginflix.example.invalid/;
        sub_filter_once off;
        sub_filter_types application/json text/html text/plain text/css application/javascript;
        sub_filter "https://identity.example.invalid" "https://admin.ginflix.example.invalid";
    }

    location /resources/ {
        proxy_pass https://$keycloak_upstream;
        proxy_ssl_server_name on;
        proxy_set_header Host identity.example.invalid;
        proxy_set_header Accept-Encoding "";
        sub_filter_once off;
        sub_filter_types text/css application/javascript application/json;
        sub_filter "https://identity.example.invalid" "https://admin.ginflix.example.invalid";
    }

    location = / {
        root /var/www/html;
        try_files /index.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    location = /index.html {
        root /var/www/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    location / {
        proxy_pass http://ginflix_ingress;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
